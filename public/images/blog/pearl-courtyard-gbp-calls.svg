<text x="74" y="79" font-family="Arial, sans-serif" font-weight="700" font-size="24" letter-spacing="4" fill="#ff9568">FIELMENTE  /  GOOGLE ADS CASE STUDY</text>
<text x="74" y="142" font-family="Arial, sans-serif" font-weight="800" font-size="56" fill="#ffffff">PEARL COURTYARD</text><text x="74" y="191" font-family="Arial, sans-serif" font-weight="600" font-size="29" fill="#cdc9e8">Varanasi, India</text>
<text x="74" y="239" font-family="Arial, sans-serif" font-size="25" fill="#ffffff">We stopped optimising for page visits.</text><text x="74" y="274" font-family="Arial, sans-serif" font-size="25" fill="#ffffff">We started optimising for phone conversations.</text>
