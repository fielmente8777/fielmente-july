<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title description">
<title id="title">Google Ads Promotional Credits for Hotel and Resort Owners</title>
<desc id="description">An editorial illustration of qualifying hotel ad spend leading to promotional credits, followed by the direct booking journey. This is not an official Google logo or badge.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#131038"/><stop offset=".57" stop-color="#19224d"/><stop offset="1" stop-color="#0b2a48"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fa995d"/><stop offset="1" stop-color="#ec5730"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#477cff"/><stop offset="1" stop-color="#164de0"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#ee6c42" stop-opacity=".27"/><stop offset="1" stop-color="#ee6c42" stop-opacity="0"/></radialGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="22" stdDeviation="26" flood-opacity=".27"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1465" cy="60" r="480" fill="url(#glow)"/>
<circle cx="40" cy="920" r="360" fill="url(#glow)" opacity=".5"/>
<path d="M1080 0 1600 520M1280 0l320 320M920 0l680 680" stroke="#fff" opacity=".045" stroke-width="3"/>
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="92" y="95" width="245" height="43" rx="22" fill="#ec673a" opacity=".19" stroke="#ffb08b"/>
  <text x="118" y="124" fill="#ffc49f" font-size="20" font-weight="700" letter-spacing="1.5">HOTEL ADS GUIDE</text>
  <text x="92" y="258" fill="#ffffff" font-size="79" font-weight="800">Advertising</text>
  <text x="92" y="358" fill="#ffffff" font-size="79" font-weight="800">Credits for</text>
  <text x="92" y="460" fill="#ff9766" font-size="79" font-weight="800">Hotels &amp; Resorts</text>
  <rect x="93" y="514" width="122" height="7" rx="3" fill="#f26633"/>
  <text x="92" y="598" fill="#dbe3f7" font-size="32">What changed with Google Partners?</text>
  <text x="92" y="648" fill="#9fb0ce" font-size="23">Eligibility • Credit tiers • Direct-booking growth</text>
  <text x="94" y="808" fill="#ffffff" font-size="32" font-weight="700">FIELMENTE</text>
  <text x="94" y="842" fill="#98a9c6" font-size="18">Hospitality Digital Marketing</text>
</g>
<g filter="url(#shadow)">
  <rect x="942" y="202" width="534" height="472" rx="38" fill="#fff"/>
  <rect x="968" y="228" width="482" height="420" rx="26" fill="#f6f8ff"/>
  <rect x="1003" y="270" width="412" height="96" rx="20" fill="#e6edff"/>
  <circle cx="1050" cy="317" r="24" fill="url(#blue)"/>
  <path d="M1040 320h20m-10-10v20" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <text x="1093" y="306" font-family="Arial,Helvetica,sans-serif" fill="#26315c" font-size="22" font-weight="700">QUALIFYING AD SPEND</text>
  <text x="1093" y="338" font-family="Arial,Helvetica,sans-serif" fill="#64718c" font-size="18">An eligible hotel campaign</text>
  <path d="M1209 386v64m-16-17 16 17 16-17" stroke="#f26633" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1003" y="467" width="412" height="139" rx="20" fill="#fff0e8" stroke="#ffc8af" stroke-width="2"/>
  <circle cx="1054" cy="535" r="27" fill="url(#accent)"/>
  <path d="m1042 537 9 9 18-22" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1102" y="525" font-family="Arial,Helvetica,sans-serif" fill="#482a31" font-size="25" font-weight="800">POTENTIAL CREDIT</text>
  <text x="1102" y="560" font-family="Arial,Helvetica,sans-serif" fill="#915e4c" font-size="19">Only after Google approval</text>
</g>
<g font-family="Arial,Helvetica,sans-serif" fill="#d0ddf3" font-size="17">
  <text x="1025" y="737">Eligibility and offer conditions apply.</text>
  <text x="1025" y="767">Not cash, a refund, or guaranteed bookings.</text>
</g>
</svg>